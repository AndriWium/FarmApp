<div class="shell">
  <aside class="sidebar">
    <div class="brand">FarmApp</div>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/grades" routerLinkActive="active">Grades</a>
      <a routerLink="/blocks" routerLinkActive="active">Blocks</a>
      <a routerLink="/crops" routerLinkActive="active">Crops</a>
      <a routerLink="/cultivars" routerLinkActive="active">Cultivars</a>
      <a routerLink="/input-items" routerLinkActive="active">Input Items</a>
      <a routerLink="/suppliers" routerLinkActive="active">Suppliers</a>
      <a routerLink="/price-lists" routerLinkActive="active">Price Lists</a>
      <a routerLink="/expense-categories" routerLinkActive="active">Expense Categories</a>
      <a routerLink="/activity-types" routerLinkActive="active">Activity Types</a>
      <!-- Products/Pack Sizes/Customers links get added later in Phase 5b-2; Stock/POS/Reports
           links get added in Phase 5c+ as those screens exist. -->
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="spacer"></span>
      @if (auth.currentUser(); as user) {
        <span class="user">{{ user.userName }} ({{ user.role }})</span>
      }
      <button type="button" (click)="auth.logout()">Log out</button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
